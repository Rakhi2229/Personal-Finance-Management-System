{% extends 'base.html' %}

{% block title %}Login - PFM FinTech Platform{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="metric-icon-box bg-income mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <h3 class="fw-bold text-white mb-2">Welcome Back</h3>
                <p class="sub-text-bright">Sign in to your FinTech Dashboard</p>
            </div>

            <form action="{{ url_for('auth.login') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Username or Email</label>
                    <input type="text" name="email_or_username" class="form-control" placeholder="john.doe@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" name="password" id="loginPassword" class="form-control" style="border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important;" placeholder="••••••••" required>
                        <button class="btn btn-toggle-password" type="button" onclick="togglePassword('loginPassword', 'loginPassIcon')">
                            <i class="fa-solid fa-eye" id="loginPassIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="remember" id="rememberCheck">
                        <label class="form-check-label sub-text-bright" for="rememberCheck">
                            Remember me
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-emerald w-100 py-3 mb-3">
                    Sign In <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
                <p class="sub-text-bright mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-success fw-bold text-decoration-none ms-1">Register here</a></p>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input && icon) {
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
}
</script>
{% endblock %}
